name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Use locked npm version
        run: npm install -g npm@11.6.2

      - name: Install dependencies
        run: npm ci

      - name: Restore News Brasil history
        uses: actions/cache/restore@v4
        with:
          path: public/data/news-brasil.json
          key: news-brasil-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            news-brasil-v1-${{ github.ref_name }}-

      - name: Collect News Brasil
        run: node scripts/collect-brasil-news.mjs

      - name: Preserve News Brasil history
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: public/data/news-brasil.json
          key: news-brasil-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Run tests
        run: npm test

      - name: Build
        env:
          VITE_OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        run: |
          if [[ -z "${VITE_OPENWEATHER_API_KEY//[[:space:]]/}" ]]; then
            echo "::error::Configure the OPENWEATHER_API_KEY repository secret before publishing."
            exit 1
          fi
          npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
